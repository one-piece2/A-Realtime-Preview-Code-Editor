services:
  # 后端服务 (NestJS)
  - type: web
    name: react-editor-backend
    env: node
    region: singapore  # 可以选择其他区域，如 oregon, frankfurt 等
    plan: free  # 免费计划，可以升级到 starter ($7/月) 获得更好的性能
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render 会自动设置 PORT，但这里作为备用
      - key: FRONTEND_URL
        sync: false  # 需要手动设置，设置为前端服务的 URL
    healthCheckPath: /
    
  # 前端服务 (React + Vite) - 使用静态站点部署
  - type: static
    name: react-editor-frontend
    region: singapore
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false  # 需要手动设置，设置为后端服务的 URL
  
  # 如果需要在生产环境使用 SSR 或需要动态路由，可以使用 Web Service：
  # - type: web
  #   name: react-editor-frontend
  #   env: node
  #   region: singapore
  #   plan: free
  #   buildCommand: cd client && npm install && npm run build
  #   startCommand: cd client && npx vite preview --host 0.0.0.0 --port $PORT
  #   envVars:
  #     - key: VITE_BACKEND_URL
  #       sync: false

